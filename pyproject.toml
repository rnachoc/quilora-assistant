[project]
name = "quilora-assistant"
version = "0.1.0"
description = "Customer-support agent for a fictional online fashion store, built on Claude tool use."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ignacio" }]
# Every runtime dependency is justified in docs/dependencies.md.
dependencies = [
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "anthropic==1.12.1",
    "pydantic==2.14.0",
    "pyyaml==6.0.3",
    "mcp==2.3.0",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
# Local embedding model for vector/hybrid policy search (phase 4).
embeddings = [
    "fastembed==0.9.0",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "httpx==0.28.1",  # FastAPI TestClient
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quilora = ["agent/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "db: needs a PostgreSQL database (skipped if unavailable)",
    "live: calls the real Anthropic API (needs ANTHROPIC_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# Generator data tables are wide by nature; random is used for reproducible fake data.
"data/**" = ["E501", "S311"]
