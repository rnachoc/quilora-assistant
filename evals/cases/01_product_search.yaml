- id: search-nonexistent-leather-coat
  category: product_search
  description: Product type the store does not sell. Must say so, not invent one.
  turns: ["¿Tenéis abrigos de cuero?"]
  expect:
    tools_called: [search_products]
    flags_exclude: [ungrounded_amount]
    language: es
  judge: The reply makes clear that no leather coats were found and does not present any non-leather product as a leather coat. It may suggest real alternatives returned by the tools.

