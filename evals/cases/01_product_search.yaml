# Author: Ignacio Rodríguez Caro
# Product search: right tool, right filters, only real products and prices in the reply.

- id: search-linen-dresses-under-60
  category: product_search
  description: Brief example. Only linen dresses under 60 EUR, real names and prices.
  turns: ["¿Tenéis vestidos de lino por menos de 60 €?"]
  expect:
    tools_called: [search_products]
    tool_args: {search_products: {max_price_eur: {lte: 60}}}
    reply_contains_all: [Garza, Brisa, Dalia]
    reply_not_contains: [Gala Linen, Marea Linen]
    language: es
    flags_exclude: [ungrounded_amount]
  judge: Every dress listed costs less than 60 EUR according to the tool results, and prices match the tool results exactly.

- id: search-black-jeans-women-en
  category: product_search
  description: English query; colour filter translated to the catalog's colour name.
  turns: ["Do you have black jeans for women?"]
  expect:
    tools_called: [search_products]
    tool_args: {search_products: {color: {contains: black}}}
    reply_contains_any: [Straight Jeans]
    language: en
    flags_exclude: [ungrounded_amount]

- id: search-men-linen-shirt
